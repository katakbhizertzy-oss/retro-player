<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0d1f">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Retro Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d1f;--bg2:#221a4d;--ink:#f4efe2;--dim:#a9a3c4;--gold:#ffcf33;--pink:#ff5d8f;--cyan:#4fe3d1;--line:#2e2a55;--px:"Press Start 2P",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#home{position:fixed;inset:0;height:100dvh;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 18px);background:radial-gradient(120% 70% at 50% -10%,var(--bg2),var(--bg) 65%)}
#home::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:14px;justify-content:center;padding-top:6px}
.led{width:12px;height:12px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);animation:pulse 2.4s ease-in-out infinite}
h1{font:clamp(18px,6vw,28px)/1.5 var(--px);margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--pink);text-align:center;animation:boot .7s steps(6) 1}
@keyframes boot{0%{opacity:0;transform:translateY(6px)}60%{opacity:.4}100%{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
.tag{margin:0;color:var(--dim);text-align:center;font-size:14px}
.start{width:100%;padding:20px 16px;border:0;border-radius:14px;background:var(--gold);color:#241c45;font:700 15px var(--px);line-height:1.6;cursor:pointer;box-shadow:0 6px 0 #a87d00,0 0 0 3px #241c45 inset;transition:transform .08s,box-shadow .08s}
.start:active{transform:translateY(5px);box-shadow:0 1px 0 #a87d00,0 0 0 3px #241c45 inset}
.start small{display:block;font:600 12px system-ui;opacity:.75;margin-top:6px}
.once{align-self:center;background:none;border:0;color:var(--dim);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:2px}
.row{display:flex;align-items:center;gap:10px;color:var(--dim)}
select{flex:1;padding:12px;border:2px solid var(--line);border-radius:12px;background:#17132f;color:var(--ink);font:inherit}
#err{min-height:1.3em;margin:0;color:var(--pink);font-weight:700;text-align:center;font-size:14px}
h2{font:12px/1.6 var(--px);color:var(--cyan);margin:6px 0 0;letter-spacing:.5px}
.tray{background:#0a0817;border:3px solid var(--line);border-radius:16px;padding:14px;box-shadow:inset 0 4px 14px rgba(0,0,0,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
.empty{margin:0;color:var(--dim);font-size:14px;text-align:center;padding:10px}
.cart{position:relative;aspect-ratio:1/1.12;background:var(--c);border-radius:10px 10px 6px 6px;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.18);transition:transform .1s}
.cart:active{transform:translateY(3px)}
.cart::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:7px;background:#e7c35a;border-radius:2px 2px 0 0}
.grip{height:14px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,transparent 3px 7px);flex:none}
.label{flex:1;background:#f4efe2;color:#241c45;border-radius:5px;padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;border-top:6px solid var(--c);overflow:hidden;margin-bottom:6px}
.label b{font:700 14px/1.2 system-ui;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.label span{font:8px var(--px);color:#6b6490}
.del{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border:2px solid #0a0817;border-radius:50%;background:var(--pink);color:#fff;font:700 15px/1 system-ui;cursor:pointer;z-index:2}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.game-card{position:relative;min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:linear-gradient(155deg,#28234d,#151329 70%);box-shadow:0 12px 28px rgba(0,0,0,.28);display:flex;flex-direction:column}
.game-art{height:128px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.game-art:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px)}
.game-art .game-emoji{position:relative;font-size:64px;filter:drop-shadow(0 8px 5px rgba(0,0,0,.3))}
.game-art.kart{background:linear-gradient(135deg,#ffb52e,#e34a35 55%,#5c2a85)}
.game-art.pokemon{background:linear-gradient(135deg,#58c8e8,#2766b9 55%,#26336f)}
.game-info{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}
.game-info h3{font-size:14px;line-height:1.3;margin:0;color:#fff}
.game-meta{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#bdb6e8}
.game-status{font-size:11px;color:#c5c0d8;min-height:16px}
.game-play{border:0;border-radius:10px;background:#ffd34e;color:#21183e;padding:11px 10px;font-weight:900;letter-spacing:.08em;font-size:12px;cursor:pointer}
.game-play:active{transform:scale(.98)}
.library-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.library-count{font-size:11px;color:#aaa3cc;border:1px solid #423b6d;border-radius:99px;padding:5px 9px}
@media(max-width:380px){.list{grid-template-columns:1fr}.game-art{height:105px}}
.hint{margin:0;color:var(--dim);font-size:12.5px;text-align:center}
button:focus-visible,select:focus-visible,.cart:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#stage{position:fixed;inset:0;height:100dvh;background:#000;display:none}
#game{width:100%;height:100%}
.fab{position:fixed;z-index:9999;top:calc(env(safe-area-inset-top) + 6px);width:40px;height:40px;border:0;border-radius:50%;background:rgba(15,13,31,.6);color:#fff;font:700 18px system-ui;opacity:.55}
#back{left:calc(env(safe-area-inset-left) + 6px)}#fs{left:calc(env(safe-area-inset-left) + 52px)}
@media (prefers-reduced-motion:reduce){h1,.led{animation:none}.cart,.start{transition:none}}

/* RETRO PLAYER UI refresh */
#home{background:radial-gradient(110% 55% at 50% -5%,#39316e 0%,#17142d 48%,#0b0a17 100%);padding-left:16px;padding-right:16px}
.wrap{max-width:620px;gap:18px}
.top{padding:14px 0 2px}
h1{font-size:clamp(21px,6vw,30px);letter-spacing:1px;text-shadow:3px 3px 0 #d34e86,0 0 24px rgba(255,198,58,.18)}
.tag{max-width:390px;margin:0 auto 3px;font-size:13px}
.start{border-radius:16px;background:linear-gradient(180deg,#ffe36a,#ffbf35);box-shadow:0 5px 0 #9a631c,0 0 0 2px rgba(255,255,255,.22) inset;font-size:13px}
.row{font-size:13px}
select{background:#191631;border-color:#474071}
h2{font-size:11px;margin-top:10px}
.tray{background:rgba(8,7,18,.6);border:1px solid #39335e;border-radius:16px;padding:12px}
.grid{gap:10px}
.cart{border-radius:12px}
#err{font-size:12px}
.hint{font-size:11px;line-height:1.65;max-width:520px;margin:0 auto 18px}
@media(max-width:390px){.game-info{padding:10px}.game-info h3{font-size:12px}.game-art{height:100px}.game-art .game-emoji{font-size:52px}.game-play{padding:10px 8px}}
</style>
</head>
<body>
<main id="home"><div class="wrap">
  <div class="top"><span class="led"></span><h1>RETRO<br>PLAYER</h1><span class="led"></span></div>
  <p class="tag">Colok kartrid, layar penuh, progres tersimpan otomatis di HP ini.</p>

  <button class="start" id="add">+ TAMBAH GAME<small>disimpan di HP ini, tinggal tap lain kali</small></button>
  <input id="addf" type="file" multiple hidden accept=".nes,.sfc,.smc,.gba,.gb,.gbc,.sms,.gg,.md,.gen,.smd,.bin,.a26,.a78,.lnx,.pce,.ngp,.ngc,.ws,.wsc,.vb">
  <button class="once" id="play">Main sekali tanpa menyimpan</button>
  <input id="file" type="file" hidden accept=".nes,.sfc,.smc,.gba,.gb,.gbc,.sms,.gg,.md,.gen,.smd,.bin,.a26,.a78,.lnx,.pce,.ngp,.ngc,.ws,.wsc,.vb">

  <div class="row"><span>Konsol</span>
    <select id="core" aria-label="Konsol">
      <option value="auto">Otomatis (dari ekstensi)</option>
      <option value="nes">NES</option><option value="snes">Super Nintendo</option>
      <option value="gb">Game Boy / Color</option><option value="gba">Game Boy Advance</option>
      <option value="segaMS">Master System</option><option value="segaGG">Game Gear</option><option value="segaMD">Mega Drive / Genesis</option>
      <option value="atari2600">Atari 2600</option><option value="atari7800">Atari 7800</option><option value="lynx">Atari Lynx</option>
      <option value="pce">PC Engine / TurboGrafx</option><option value="ngp">Neo Geo Pocket</option>
      <option value="ws">WonderSwan</option><option value="vb">Virtual Boy</option>
    </select>
  </div>
  <p id="err" role="alert"></p>

  <div class="library-head"><h2>GAME LIBRARY</h2><span class="library-count" id="gameCount">2 GAMES</span></div>
  <div id="list" class="list" aria-live="polite"></div>
  <h2>MY CARTRIDGES</h2>
  <div class="tray"><div id="lib" class="grid"></div></div>
  <p class="hint">Game bawaan dibaca langsung dari folder roms/. Game tambahan disimpan di browser HP ini. Tambahkan ke layar utama untuk pengalaman seperti aplikasi.</p>
</div></main>

<div id="stage"><button class="fab" id="back" aria-label="Ganti game">&#8249;</button><button class="fab" id="fs" aria-label="Layar penuh">&#9974;</button><div id="game"></div></div>

<script>

var dbg=document.createElement('div'); dbg.id='dbg';
dbg.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#300;color:#fff;font:12px/1.4 monospace;padding:8px;border-radius:8px;display:none;word-break:break-all;max-height:40vh;overflow:auto';
document.body.appendChild(dbg);
function showDbg(m){ dbg.style.display='block'; dbg.textContent+=m+'\n'; }
(function(){
  var o=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(m,u){
    var x=this, url=u;
    x.addEventListener('error',function(){ showDbg('GAGAL UNDUH: '+url); });
    x.addEventListener('load',function(){ if(x.status>=400) showDbg('HTTP '+x.status+': '+url); });
    return o.apply(this,arguments);
  };
})();
if(location.search.indexOf('nosw')>-1 && 'serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(g){g.unregister()}); });
  if(window.caches) caches.keys().then(function(k){ k.forEach(function(n){caches.delete(n)}); });
  showDbg('Service worker & cache dihapus. Buka lagi tanpa ?nosw');
}
// EmulatorJS selalu dimuat dari folder lokal agar GitHub Pages dan Termux memakai file yang sama.
var BASE=new URL('emulatorjs/data/',document.baseURI).href;
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
var EXT={nes:'nes',sfc:'snes',smc:'snes',gba:'gba',gb:'gb',gbc:'gb',sms:'segaMS',gg:'segaGG',md:'segaMD',gen:'segaMD',smd:'segaMD',bin:'segaMD',a26:'atari2600',a78:'atari7800',lnx:'lynx',pce:'pce',ngp:'ngp',ngc:'ngp',ws:'ws',wsc:'ws',vb:'vb'};
var LABEL={nes:'NES',snes:'SNES',gb:'GAME BOY',gba:'GBA',segaMS:'MASTER SYS',segaGG:'GAME GEAR',segaMD:'MEGA DRIVE',atari2600:'ATARI 2600',atari7800:'ATARI 7800',lynx:'LYNX',pce:'PC ENGINE',ngp:'NEO GEO PKT',ws:'WONDERSWAN',vb:'VIRTUAL BOY'};
var COLOR={nes:'#8e8e96',snes:'#a59fc2',gb:'#9ea08a',gba:'#6a4fb0',segaMS:'#2c2c36',segaGG:'#34344a',segaMD:'#1f2a4a',atari2600:'#6b3f23',atari7800:'#4a3a30',lynx:'#2f6f68',pce:'#c96a2a',ngp:'#3b5fa8',ws:'#5a5a66',vb:'#a8203a'};
var $=function(i){return document.getElementById(i)};

function goFull(){
  var el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
  try{ if(f&&!document.fullscreenElement&&!document.webkitFullscreenElement){ var p=f.call(el); if(p&&p.catch)p.catch(function(){}); } }catch(e){}
  try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
}
function detect(n){var s=$('core').value; if(s!=='auto')return s; var m=/\.([a-z0-9]+)$/i.exec(n); return m?EXT[m[1].toLowerCase()]:null;}
function start(url,name,core){
  if(!core){ $('err').textContent='Konsol tidak dikenali. Pilih konsol manual lalu coba lagi.'; return; }
  if(url.indexOf('blob:')!==0){
    url=new URL(url,document.baseURI).href;
    fetch(url,{method:'HEAD'}).then(function(r){
      if(!r.ok){ $('err').textContent='ROM tidak ditemukan ('+r.status+'): '+url+' - pastikan folder roms ikut terunggah ke GitHub.'; return; }
      go2();
    }).catch(function(){ $('err').textContent='Tidak bisa membaca ROM: '+url+' (buka lewat http://localhost, jangan file://)'; });
  } else go2();
  function go2(){
  $('home').style.display='none'; $('stage').style.display='block';
  window.EJS_player='#game'; window.EJS_core=core; window.EJS_gameUrl=url;
  window.EJS_gameName=name.replace(/\.[^.]+$/,''); window.EJS_pathtodata=BASE;
  window.EJS_startOnLoaded=true; window.EJS_color='#ffcf33'; window.EJS_language='id';
  var s=document.createElement('script'); s.src=BASE+'loader.js';
  s.onerror=function(){ $('stage').style.display='none'; $('home').style.display='block'; $('err').textContent='Emulator lokal tidak ditemukan. Jalankan sh setup-offline.sh di Termux, lalu unggah folder emulatorjs ke GitHub.'; };
  document.body.appendChild(s);
  }
}
$('play').addEventListener('click',function(){ goFull(); $('file').click(); });
$('add').addEventListener('click',function(){ $('addf').click(); });
$('file').addEventListener('change',function(e){ var f=e.target.files[0]; if(!f)return; $('err').textContent=''; goFull(); start(URL.createObjectURL(f),f.name,detect(f.name)); });
$('back').addEventListener('click',function(){ location.reload(); });
$('fs').addEventListener('click',goFull);

var DB;
function db(){return new Promise(function(res,rej){ if(DB)return res(DB); var r=indexedDB.open('retro-lib',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('roms',{keyPath:'id',autoIncrement:true})};
  r.onsuccess=function(){DB=r.result;res(DB)}; r.onerror=function(){rej(r.error)}; });}
function store(m){return db().then(function(d){return d.transaction('roms',m).objectStore('roms')})}
function rq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function renderLib(){
  store('readonly').then(function(s){return rq(s.getAll())}).then(function(a){
    var box=$('lib'); box.innerHTML='';
    if(!a.length){ box.innerHTML='<p class="empty" style="grid-column:1/-1">Rak masih kosong. Tap + TAMBAH GAME.</p>'; return; }
    a.forEach(function(g){
      var c=document.createElement('div'); c.className='cart'; c.tabIndex=0; c.setAttribute('role','button'); c.style.setProperty('--c',COLOR[g.core]||'#777');
      var gr=document.createElement('i'); gr.className='grip';
      var lb=document.createElement('div'); lb.className='label';
      var t=document.createElement('b'); t.textContent=g.name;
      var k=document.createElement('span'); k.textContent=LABEL[g.core]||g.core;
      lb.appendChild(t); lb.appendChild(k); c.appendChild(gr); c.appendChild(lb);
      var go=function(){ goFull(); start(URL.createObjectURL(g.blob),g.file,g.core); };
      c.onclick=go; c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
      var d=document.createElement('button'); d.className='del'; d.textContent='\u00d7'; d.setAttribute('aria-label','Hapus '+g.name);
      d.onclick=function(e){ e.stopPropagation(); if(!confirm('Hapus "'+g.name+'" dari rak?'))return; store('readwrite').then(function(s){return rq(s.delete(g.id))}).then(renderLib); };
      c.appendChild(d); box.appendChild(c);
    });
  }).catch(function(){ $('lib').innerHTML='<p class="empty" style="grid-column:1/-1">Penyimpanan browser tidak tersedia (mode penyamaran?). Pakai Main sekali.</p>'; });
}
$('addf').addEventListener('change',function(e){
  var files=[].slice.call(e.target.files); e.target.value=''; if(!files.length)return; $('err').textContent='';
  var bad=[]; var jobs=files.map(function(f){ var core=detect(f.name); if(!core){bad.push(f.name);return Promise.resolve();}
    return store('readwrite').then(function(s){return rq(s.add({name:f.name.replace(/\.[^.]+$/,''),file:f.name,core:core,blob:f}))}); });
  Promise.all(jobs).then(function(){ if(bad.length)$('err').textContent='Tidak dikenali: '+bad.join(', ')+'. Pilih konsol manual lalu coba lagi.'; renderLib(); })
    .catch(function(){ $('err').textContent='Gagal menyimpan (penyimpanan penuh atau mode penyamaran).'; });
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
});
renderLib();
var BUILTIN_GAMES=[
  {name:'Mario Kart: Super Circuit',file:'roms/mariokart-super-circuit.gba',core:'gba',kind:'kart',emoji:'🏎️',short:'MARIO KART'},
  {name:'Pokémon FireRed',file:'roms/pokemon-firered.gba',core:'gba',kind:'pokemon',emoji:'🔥',short:'POKÉMON'}
];
function renderBuiltinGames(a){
  var box=$('list'); box.innerHTML='';
  $('gameCount').textContent=a.length+' GAMES';
  a.forEach(function(g){
    var card=document.createElement('article'); card.className='game-card';
    var art=document.createElement('div'); art.className='game-art '+(g.kind||''); 
    var em=document.createElement('div'); em.className='game-emoji'; em.textContent=g.emoji||(g.core==='gba'?'🎮':'🕹️'); art.appendChild(em);
    var info=document.createElement('div'); info.className='game-info';
    var title=document.createElement('h3'); title.textContent=g.name;
    var meta=document.createElement('div'); meta.className='game-meta'; meta.textContent=(g.short||g.core||'GAME')+'  •  '+(LABEL[g.core]||g.core||'AUTO');
    var status=document.createElement('div'); status.className='game-status'; status.textContent='Built-in cartridge';
    var play=document.createElement('button'); play.className='game-play'; play.type='button'; play.textContent='▶ PLAY';
    play.addEventListener('click',function(){
      $('err').textContent='';
      var romUrl=new URL('./'+g.file.replace(/^\.\//,''),document.baseURI).href;
      fetch(romUrl,{method:'GET',headers:{'Range':'bytes=0-0'},cache:'no-store'}).then(function(r){
        if(!r.ok && r.status!==206) throw new Error('HTTP '+r.status+' — '+romUrl);
        goFull(); start(romUrl,g.file.split('/').pop(),g.core||detect(g.file));
      }).catch(function(e){
        $('err').textContent='ROM tidak ditemukan di '+romUrl+'. Pastikan file .gba benar-benar ada di repository: roms/'+g.file.split('/').pop()+'. Upload folder roms ke root repository, lalu tunggu GitHub Pages selesai deploy.';
      });
    });
    info.appendChild(title); info.appendChild(meta); info.appendChild(status); info.appendChild(play);
    card.appendChild(art); card.appendChild(info); box.appendChild(card);
  });
}
fetch(new URL('./roms/roms.json',document.baseURI).href,{cache:'no-store'}).then(function(r){
  if(!r.ok) throw new Error('manifest HTTP '+r.status);
  return r.json();
}).then(function(a){
  if(!Array.isArray(a)||!a.length) throw new Error('manifest kosong');
  renderBuiltinGames(a);
}).catch(function(){
  // Fallback: jangan pernah menyembunyikan game bawaan hanya karena manifest fetch gagal.
  renderBuiltinGames(BUILTIN_GAMES);
});
</script>
</body>
</html>
